expose_php = Off
memory_limit = 256M
max_execution_time = 60

upload_max_filesize = 8M
post_max_size = 8M

; Assertions are a development aid. In production they should be compiled out
; entirely (-1) rather than merely skipped at runtime (0), so the calls cost
; nothing instead of costing a conditional.
zend.assertions = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16

; Laravel plus the Composer vendor tree loads well over a thousand classes, and
; any file that misses this limit is simply not cached. The old value of 10000
; was close enough to the ceiling that a few extra packages pushed real classes
; out of the cache and cost a stat() + compile on every request.
opcache.max_accelerated_files = 20000

; Keep DocBlocks in the cache. Composer's classmap and Laravel's container
; resolution both read them, and stripping them makes reflection fall back to
; slower runtime parsing.
opcache.save_comments = 1

; JIT compiles hot loops to machine code, which is a measurable win on the
; CPU-bound work this app does (Eloquent hydration, Blade rendering, the
; dashboard's aggregate queries). Requires a non-zero buffer size; leaving the
; buffer at 0 silently disables the setting above.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; The realpath cache is the quieter bottleneck. PHP resolves thousands of
; include paths per request, and every one that misses falls back to a
; full filesystem walk. The defaults (4M, 120s) are sized for a small CLI
; script rather than a framework, so they thrash under load.
realpath_cache_size = 16M
realpath_cache_ttl = 600

; Files never change at runtime in a deployed container.
opcache.validate_timestamps = 0
