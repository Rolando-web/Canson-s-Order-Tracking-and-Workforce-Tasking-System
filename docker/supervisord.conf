[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
; Render runs the container as root, and php-fpm refuses to start as root
; unless told otherwise. The master needs root to bind the port and to drop
; the pool workers to www-data via the user/group directives in
; /usr/local/etc/php-fpm.d/www.conf, which still apply to the workers.
command=php-fpm --nodaemon --allow-to-run-as-root
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
; nginx binds port 80, which needs privileges the www-data user does not
; have. Its workers still drop to www-data via the user directive in
; /etc/nginx/nginx.conf.
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0