[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
; Run as www-data rather than as root. php-fpm exits 64 with a usage dump
; when it detects it is running as root, and --allow-to-run-as-root is not
; honoured on every php-fpm build, so avoid the root case entirely.
; Binding 127.0.0.1:9000 needs no privileges because the port is above 1024.
; The user/group directives in php-fpm.d/www.conf are ignored when the master
; is not root, which is what we want here.
; The shipped php-fpm.conf sets this. Restating it here makes the path
; obvious and survives someone deleting our config in favour of the stock one.
command=php-fpm -F --fpm-config /usr/local/etc/php-fpm.conf
user=www-data
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; nginx binds port 80 and its master needs root to do so, so this one stays
; root. Its workers still drop to www-data via the user directive in
; /etc/nginx/nginx.conf.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0