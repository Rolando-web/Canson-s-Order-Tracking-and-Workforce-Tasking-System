; Serve the pool pid file from a directory owned by www-data, since the
; php-fpm master now runs unprivileged and cannot write /usr/local/var.
[global]
pid = /run/php/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000

; ondemand rather than dynamic. Render's free tier gives the container ~512 MB
; and a shared 0.1 CPU, so idle workers are not free: they hold tens of MB of
; RSS each that the OS would rather spend on page cache backing opcache.
; dynamic also keeps min_spare workers resident forever, which is exactly the
; wrong trade for a container that is asleep most of the time.
; ondemand forks a worker only when a request arrives and reaps it once it goes
; idle, so bursts still get parallelism while an idle container costs ~0.
pm = ondemand

; Raised from 5 only because ondemand reaps idle workers, so the peak
; concurrency is affordable now where a permanently-resident pool was not.
; Do not raise this much further: each worker is roughly 50-60 MB RSS and the
; container has 512 MB total. Going over does not add throughput on a 0.1 CPU
; instance, it just trades a queue for an OOM kill.
pm.max_children = 6

; Reap a worker after 10s idle. Long enough that normal page-to-page browsing
; keeps hitting warm workers, short enough that the container actually gives
; memory back between bursts.
pm.process_idle_timeout = 10s

; Recycling a worker means a fresh fork and a cold opcache view for that
; process, which is not free on a CPU-starved instance. The old value of 500
; forced a restart roughly every few minutes of steady traffic; 1000 still
; bounds any slow leak while halving that churn.
pm.max_requests = 1000

; Without this, a single slow request occupies one of six workers until it hits
; max_execution_time. Several of those and the site looks dead even though the
; processes are healthy. This is the usual cause of "it randomly hangs".
request_terminate_timeout = 45s

; Emit a stack trace for anything slower than 5s straight to the container log.
; Render captures stderr, so slow requests become visible without an SSH
; session, which is how the slow queries behind this tuning get found.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; Already implied by running the master as www-data, but stating it keeps the
; intent explicit if the process is ever started as root.
user = www-data
group = www-data

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Match the CLI so artisan and the FPM workers agree on limits.
php_admin_value[memory_limit] = 256M
php_admin_flag[log_errors] = on
