; Serve the pool pid file from a directory owned by www-data, since the
; php-fpm master now runs unprivileged and cannot write /usr/local/var.
[global]
pid = /run/php/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Already implied by running the master as www-data, but stating it keeps the
; intent explicit if the process is ever started as root.
user = www-data
group = www-data

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Match the CLI so artisan and the FPM workers agree on limits.
php_admin_value[memory_limit] = 256M
php_admin_flag[log_errors] = on